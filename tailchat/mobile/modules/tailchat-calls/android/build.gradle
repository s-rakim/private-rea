plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'net.tailchat.calls'
version = '0.1.0'

android {
  namespace "net.tailchat.calls"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
}
