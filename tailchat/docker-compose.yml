# Tailchat on Docker.
#
# The tailscale container joins your tailnet as its own machine ("tailchat")
# and serves https://tailchat.<your-tailnet>.ts.net with a real certificate.
# The tailchat container shares its network, so tailscale serve reaches it on
# 127.0.0.1 and passes along who each visitor is. Nothing is published on the
# Docker host and Funnel stays off, so only your tailnet can reach it.
#
#   1. In the Tailscale admin console enable MagicDNS and HTTPS certificates,
#      and create a one-off, pre-approved auth key (Settings > Keys).
#   2. echo "TS_AUTHKEY=tskey-auth-..." > .env
#   3. docker compose up -d --build
#   4. open https://tailchat.<your-tailnet>.ts.net from any device on the tailnet
#
# The key is only used the first time; the node's identity is then kept in
# the tailscale-state volume, so you can delete the key from .env.
#
# Tailchat lists every machine of yours on the tailnet as a chat. It asks the
# tailscale container, read-only, over the tailscaled socket the two
# containers share (the tailscale-socket volume).
#
# Voice and video calls run on the calls container, built from the peer-calls
# source in ./calls and served at https://tailchat.<your-tailnet>.ts.net:3443. Tailchat rings your devices and
# opens the call's room inside the app; the room connects the devices to each
# other with WebRTC, directly across the tailnet. To keep calls built into
# Tailchat instead, set TAILCHAT_CALLS_PORT=0 in .env.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TAILCHAT_HOSTNAME:-tailchat}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TAILCHAT_HOSTNAME:-tailchat}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      # Userspace networking: tailscaled needs no tun device and no
      # capabilities, and nothing but `tailscale serve` is reachable.
      TS_USERSPACE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - ./docker/serve.json:/config/serve.json:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: unless-stopped

  tailchat:
    build: .
    image: tailchat:latest
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
        # Recreating the tailscale container gives it a new network; this
        # restarts Tailchat with it, so `tailscale serve` can still reach it.
        restart: true
    environment:
      TAILCHAT_AUTH: serve
      TAILCHAT_HOST: 127.0.0.1
      TAILCHAT_PORT: "8443"
      TAILCHAT_MAX_UPLOAD_MB: ${TAILCHAT_MAX_UPLOAD_MB:-2048}
      # Your machines, from the tailscale container (off to turn the list off).
      TAILCHAT_TAILNET: ${TAILCHAT_TAILNET:-localapi}
      TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
      # The port docker/serve.json serves the calls container on.
      TAILCHAT_CALLS_PORT: ${TAILCHAT_CALLS_PORT:-3443}
    volumes:
      - tailchat-data:/data
      # Tailchat runs as an unprivileged user, so tailscaled only lets it
      # read: who is on the tailnet, never change anything.
      - tailscale-socket:/var/run/tailscale:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: unless-stopped

  # The call service: peer-calls (Apache-2.0), built here from its source in
  # ./calls, so no outside image is used. Only reachable through tailscale
  # serve on port 3443. It only passes call setup between browsers ("mesh");
  # the audio and video go device to device. No STUN or TURN servers: your
  # devices reach each other on their tailnet addresses, so nothing about a
  # call leaves the tailnet.
  calls:
    build: ./calls
    image: tailchat-calls:latest
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
        restart: true
    environment:
      PEERCALLS_BIND_HOST: 127.0.0.1
      PEERCALLS_BIND_PORT: "3000"
      PEERCALLS_NETWORK_TYPE: mesh
      PEERCALLS_STORE_TYPE: memory
      # Empty: no STUN or TURN servers at all.
      PEERCALLS_ICE_SERVER_URLS: ""
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: unless-stopped

volumes:
  tailscale-state:
  tailchat-data:
  # Only the socket lives here, in memory.
  tailscale-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m
