name: Android APK

# Builds the Tailchat Android app on EAS (expo.dev) and publishes a GitHub
# release with a link to the build and the APK attached. Needs an EXPO_TOKEN
# repository secret (an access token from expo.dev > Account settings).
#
# Run it from the Actions tab or push a tag such as mobile-v0.1.0. Without a
# tag, the release is named after the version in tailchat/mobile/app.json.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: false
  push:
    tags:
      - 'mobile-v*'
    branches:
      - tailchat-android-apk-6f3lh1
    paths:
      - 'tailchat/mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tailchat/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
      EAS_CLI: eas-cli@24.13.0
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - name: Check for the Expo token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Pick the release tag
        run: |
          [ -n "$TAG" ] || TAG="mobile-v$(jq -r .expo.version app.json)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tailchat/mobile/package-lock.json

      - run: npm ci

      - name: Link the EAS project
        run: npx --yes "$EAS_CLI" init --non-interactive --force

      - name: Build the APK on EAS
        run: |
          npx --yes "$EAS_CLI" build --platform android --profile apk --non-interactive --wait --json > build.json
          cat build.json

      - name: Download the APK
        id: apk
        run: |
          id=$(jq -r '.[0].id' build.json)
          apk_url=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl' build.json)
          owner=$(jq -r '.[0].project.ownerAccount.name // empty' build.json)
          slug=$(jq -r '.[0].project.slug // "tailchat"' build.json)
          [ -n "$owner" ] || owner=$(npx --yes "$EAS_CLI" whoami | head -n1)
          echo "page=https://expo.dev/accounts/$owner/projects/$slug/builds/$id" >> "$GITHUB_OUTPUT"
          echo "apk=$apk_url" >> "$GITHUB_OUTPUT"
          curl -fsSL "$apk_url" -o "tailchat-$TAG.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE: ${{ steps.apk.outputs.page }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          cat > notes.md <<NOTES
          Tailchat for Android, built on EAS.

          * Build page on expo.dev: $PAGE
          * APK direct download: $APK (expo.dev keeps build files for a limited time; the copy attached below stays)

          Install Tailscale on the phone and sign in to your tailnet, then open Tailchat and enter your server address, such as https://tailchat.your-tailnet.ts.net.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "tailchat-$TAG.apk" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "tailchat-$TAG.apk" --target "$GITHUB_SHA" --title "Tailchat for Android ${TAG#mobile-}" --notes-file notes.md
          fi
